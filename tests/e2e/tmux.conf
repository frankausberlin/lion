# Deterministic terminal for the interactive watch E2E scenarios.
#
# The scenarios run a real interactive zsh inside tmux, so the prompt/screen
# assertions go through a real terminal emulator and the maintainer can attach
# live (see "Alpha testing" in tests/e2e/README.md and the test strategy in
# docs/explanation/testing-strategy.md). The server is started once per session
# with this file by tests/e2e/conftest.py; the settings below make the pane
# geometry and terminal type stable across the whole run.

# tmux-256color is the pane's TERM; it needs the ncurses-term package, which
# the runtime image installs next to tmux. Powerlevel10k renders the `●` segment
# correctly under it.
set-option -g default-terminal "tmux-256color"

# Advertise truecolor to applications that query it.
set-option -ga terminal-overrides ",*:Tc"

# Keep a usable history for scrollback captures.
set-option -g history-limit 5000

# No status bar: the pane owns the full 80x24 grid.
set-option -g status off

# Keep a dead pane instead of destroying it. This makes tmux reap the exited
# shell immediately (it needs the exit status to mark the pane dead), so no
# zombie process is left behind for the segment-liveness check to see as alive.
set-option -g remain-on-exit on

# Keep the server alive when the last session ends. Each Zsh is one session and
# sessions are created and destroyed during the run; a surviving server keeps
# this configuration (and the default socket) for the next session.
set-option -g exit-empty off

# The window geometry is pinned to 80x24 *per window* by the driver
# (tests/e2e/watchutil.py runs `resize-window` after each `new-session`, which
# sets `window-size manual` for that window). A global `window-size manual`
# would crash the server as soon as a session is created while no client is
# attached — observed on tmux 3.4 (Ubuntu 24.04) and 3.6 — so it is deliberately
# not set here.
