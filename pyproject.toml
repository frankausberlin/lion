[project]
name = "lion"
version = "0.1.0"  # project-version
description = "lion project generated by pyinit."
readme = "README.md"
authors = [
    { name = "Frank Bl\u00f6cher" }
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.27.3",
    "mcp>=2.3.0,<3",
]

[project.scripts]
"lion" = "lion.main:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "bump-my-version>=1.6.7",
    "pip-audit>=2.10.1",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
    "radon>=6.0.1",
    "vulture>=2.16",
]

e2e = [
    "pytest>=9.1.1",
]


[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [".kilo"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "-q", "--strict-markers"]
markers = [
    "e2e: opt-in Docker suite; run only via `just test-e2e`",
    "agent: opt-in provider suite; run only via `just test-agent`",
]

[tool.coverage.report]
fail_under = 90
exclude_also = [
    "if __name__ == .__main__.:",
]

[tool.bumpversion]
current_version = "0.1.0"
commit = true
tag = true
tag_name = "v{new_version}"
message = "chore: bump version from {current_version} to {new_version}"
pre_commit_hooks = ["uv lock", "git add uv.lock"]

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"  # project-version'
replace = 'version = "{new_version}"  # project-version'

[[tool.bumpversion.files]]
filename = "src/lion/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'
