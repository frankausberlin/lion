name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - run: just test-e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-artifacts
          path: |
            e2e-artifacts.*/**
            !e2e-artifacts.*/work/**
          if-no-files-found: ignore
